<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

  <!-- Per-route SEO meta (title, description, canonical, OG, Twitter,
       JSON-LD) is emitted by the React <Seo> component on the public
       marketing surface and frozen into static HTML by the
       Playwright-driven prerender step in scripts/cloud/prerender.mjs
       (Clipnest Cloud only). The
       SPA shell index.html below carries only the framework bootstrap
       and PWA/icon metadata — anything route-specific would either
       conflict with React 19's head-hoisting or mislead scrapers on
       the auth-only routes (/login /register) that we explicitly
       Disallow in robots.txt. -->
  <title>Clipnest</title>

  <!-- Favicons and app icons. -->
  <link rel="icon" type="image/svg+xml" href="/logo.svg" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

  <!-- PWA. The manifest declares installable metadata; Apple-specific
       tags are necessary because iOS Safari ignores parts of the
       manifest and uses these instead. -->
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#06070C" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Clipnest" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="application-name" content="Clipnest" />

  <!-- Performance hint. The typefaces are self-hosted (src/fonts, declared in
       src/fonts/fonts.css); preloading the Latin Inter subset lets the browser
       fetch it alongside the stylesheet instead of after it. `crossorigin` is
       required for font preloads even on the same origin. -->
  <link rel="preload" href="/src/fonts/inter-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin />

  <!-- Pre-React boot overlay. The marketing landing for `/` is prerendered
       by scripts/cloud/prerender.mjs and served as static HTML, so a logged-in
       user briefly sees the landing markup before React mounts and routes
       them into the app. The script below detects an auth token in
       localStorage/sessionStorage and paints a fullscreen spinner over
       the prerendered DOM until App.tsx's first useEffect tears it down.
       Self-contained CSS so it works before the bundle CSS finishes
       parsing on a cold load. No-op when no token is present so anonymous
       visitors still see the landing instantly. -->
  <style>
    #boot-overlay { position: fixed; inset: 0; display: flex;
      align-items: center; justify-content: center; background: #06070C;
      color: #9aa0a6; font-family: Inter, system-ui, sans-serif;
      z-index: 2147483647; }
    #boot-overlay > div { text-align: center; }
    #boot-overlay .boot-spinner { width: 28px; height: 28px;
      border: 3px solid #2a2d35; border-top-color: #7c8cff;
      border-radius: 50%; animation: boot-spin .8s linear infinite;
      margin: 0 auto; }
    #boot-overlay p { margin-top: 1.5rem; font-size: 0.875rem; }
    @keyframes boot-spin { to { transform: rotate(360deg); } }
    html[data-auth-check="1"] body > #root { display: none; }
    html[data-theme="light"] #boot-overlay { background: #ffffff;
      color: #3c4043; }
    html[data-theme="light"] #boot-overlay .boot-spinner {
      border-color: #e0e0e0; border-top-color: #3367d6; }
  </style>
  <script>
    (function () {
      try {
        var token = localStorage.getItem('clipnest-token')
                 || sessionStorage.getItem('clipnest-token');
        if (!token) return;
        var lang = localStorage.getItem('clipnest-lang')
                || (navigator.language || 'en').slice(0, 2).toLowerCase();
        var msgs = {
          en: 'Checking your session…',
          pl: 'Sprawdzanie sesji…',
          de: 'Sitzung wird geprüft…',
          fr: 'Vérification de la session…',
          it: 'Verifica sessione…',
          es: 'Comprobando la sesión…',
          no: 'Sjekker økten…',
          tlh: 'ghuS lulajchugh…'
        };
        var msg = msgs[lang] || msgs.en;
        document.documentElement.setAttribute('data-auth-check', '1');
        var insert = function () {
          if (document.getElementById('boot-overlay')) return;
          var d = document.createElement('div');
          d.id = 'boot-overlay';
          var inner = document.createElement('div');
          var sp = document.createElement('div');
          sp.className = 'boot-spinner';
          var p = document.createElement('p');
          p.textContent = msg;
          inner.appendChild(sp);
          inner.appendChild(p);
          d.appendChild(inner);
          (document.body || document.documentElement).appendChild(d);
        };
        if (document.body) insert();
        else document.addEventListener('DOMContentLoaded', insert, { once: true });
      } catch (e) { /* storage blocked → fall through to prerendered HTML */ }
    })();
  </script>
</head>
<body>
  <script src="/theme-init.js"></script>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
