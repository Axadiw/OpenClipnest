name: Feature request
description: An idea for OpenClipnest.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Some things are out of scope on purpose: more than one account, features of the hosted service (plans, e-mail, passkeys, social sign-in), and a push path that bundles the apps' publisher credentials. CONTRIBUTING.md explains why.
  - type: textarea
    id: problem
    attributes:
      label: What problem would it solve?
      description: What you are trying to do, and what gets in the way today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like to happen?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
