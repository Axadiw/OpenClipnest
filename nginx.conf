# Self-hosted web frontend: serves the SPA and proxies /api/ to the API
# container. The Clipnest Cloud image uses nginx.cloud.conf instead (adds the
# SEO prerender probe and the third-party origins its edition loads).
server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;

    # Resolve the backend containers on every request (cached 10 s) through
    # Docker's embedded DNS, instead of once at startup. A container that is
    # restarted or recreated (an upgrade, a crash) comes back with a new IP;
    # with a startup-time lookup nginx keeps proxying to the old one and every
    # API call answers 502 until nginx itself is restarted. The variables are
    # what makes nginx resolve at request time.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $clipnest_api http://clipnest-api:3000;
    set $clipnest_mcp http://clipnest-mcp:3100;

    # gzip on hashed /assets/ JS/CSS plus HTML — the main bundle drops from
    # ~900 KiB to under 300 KiB transferred.
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types
        text/css
        text/plain
        text/xml
        text/javascript
        application/javascript
        application/json
        application/xml
        application/xml+rss
        image/svg+xml
        application/wasm;

    # SPA fallback: every app route resolves to index.html.
    #
    # CSP: the app talks only to its own origin, typefaces included (they are
    # served from /assets/ like the rest of the bundle). The script hash admits
    # the inline boot-overlay script in index.html.
    location / {
        try_files $uri $uri/index.html /index.html;
        # Short TTL on HTML so a new release rolls out quickly; hashed
        # /assets/ keeps its 1y immutable below.
        add_header Cache-Control "public, max-age=300, must-revalidate" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-AeP+EWrruV+HSoxx0YgRvBqJDhvF4N5Hn3gUf2a5rMc='; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' blob: data:; media-src 'self' blob:; connect-src 'self'; frame-src 'none'; frame-ancestors 'none'; form-action 'self'; base-uri 'self'" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy same-origin always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), magnetometer=(), gyroscope=(), accelerometer=()" always;
    }

    # Static asset caching (Vite uses content-hashed filenames)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-AeP+EWrruV+HSoxx0YgRvBqJDhvF4N5Hn3gUf2a5rMc='; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' blob: data:; media-src 'self' blob:; connect-src 'self'; frame-src 'none'; frame-ancestors 'none'; form-action 'self'; base-uri 'self'" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy same-origin always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), magnetometer=(), gyroscope=(), accelerometer=()" always;
    }

    # Defense-in-depth: the internal API (/internal/*, X-Internal-Key gated,
    # consumed only by the FTPS container) must never be proxied publicly.
    # nginx only forwards /api/ to the backend, so /internal/ already 404s as
    # an SPA route — this explicit 403 makes the deny intentional and
    # audit-visible.
    location /internal/ {
        return 403;
    }

    # The consent callback of the MCP OAuth flow is called by the API straight
    # over the container network (INTERNAL_MCP_URL), never through this proxy.
    # Its own guard — refusing requests that carry X-Forwarded-Host — cannot
    # work behind this proxy, which does not set that header, so the shared
    # key would be the only protection. Refuse the whole /mcp/oauth/internal
    # prefix here. It is a case-insensitive regex on purpose: the MCP server
    # (Express) routes case-insensitively, but a plain nginx prefix location is
    # case-sensitive on Linux, so /mcp/OAuth/internal/… would slip past it. A
    # regex location is tried after the longest prefix match and wins over the
    # generic /mcp location below (it has no ^~ modifier).
    location ~* ^/mcp/oauth/internal(/|$) {
        return 403;
    }

    # MCP server (LLM access to your recordings): the endpoint itself and the
    # two OAuth discovery documents MCP clients fetch from the site root.
    location /mcp {
        proxy_pass $clipnest_mcp;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 300s;
        client_max_body_size 1m;
    }
    location = /.well-known/oauth-protected-resource {
        proxy_pass $clipnest_mcp;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location = /.well-known/oauth-authorization-server {
        proxy_pass $clipnest_mcp;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # API proxy to the backend container
    location /api/ {
        proxy_pass $clipnest_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_connect_timeout 10s;
        client_max_body_size 1m;
    }
}
